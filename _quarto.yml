project:
  type: book
  output-dir: docs

book:
  title: "The Unix Shell"
  subtitle: "Software Carpentry"
  author: "The Carpentries"
  date: "2014-10-22"
  license: "CC-BY 4.0"
  repo-url: "https://github.com/swcarpentry/shell-novice"
  repo-branch: "main"
  language: en
  chapters:
    - index.qmd
    - 01-intro.qmd
    - 02-filedir.qmd
    - 03-create.qmd
    - 04-pipefilter.qmd
    - 05-loop.qmd
    - 06-script.qmd
    - 07-find.qmd
    - setup.qmd
    - reference.qmd
    - discuss.qmd
    - instructor-notes.qmd
    - learner-profiles.qmd
  sidebar:
    title: "The Unix Shell"
    style: docked
    background: light
    search: true
    tools:
      - icon: github
        href: https://github.com/swcarpentry/shell-novice

filters:
  - _extensions/carpentries/episode-meta.lua

format:
  html:
    theme:
      - cosmo
      - styles/carpentries.scss
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    code-copy: true
    code-link: true
    code-line-numbers: true
    code-block-bg: "#f8f8f8"
    code-block-border-left: "#2b3990"
    highlight-style: arrow
    citations-hover: true
    footnotes-hover: true
  pdf:
    documentclass: scrbook
    classoption:
      - oneside
      - 11pt
    papersize: letter
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: "carpentries-blue"
    urlcolor: "carpentries-blue"
    citecolor: "carpentries-green"
    pdf-engine: lualatex
    mainfont: Fira Sans
    monofont: Source Code Pro
    include-in-header:
      - text: |
          \usepackage{fontspec}
          \setmainfont{Fira Sans}
          \setmonofont{Source Code Pro}[Scale=MatchLowercase]
          \usepackage{geometry}
          \geometry{margin=1in}
          \usepackage{fancyhdr}
          \pagestyle{fancy}
          \fancyhf{}
          \fancyhead[LE,RO]{\leftmark}
          \fancyfoot[LE,RO]{\thepage}
          \renewcommand{\headrulewidth}{0.4pt}
          \definecolor{carpentries-blue}{HTML}{2b3990}
          \definecolor{carpentries-green}{HTML}{6ab187}
          \definecolor{carpentries-orange}{HTML}{f0ad4e}
          \definecolor{carpentries-red}{HTML}{d9534f}
    keep-tex: true
